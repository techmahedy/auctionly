services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: file
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    expose:
      - 80
    networks:
      - default
      - proxy

  database:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-storage:
  database-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  proxy:
    external: true
